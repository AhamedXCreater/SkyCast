<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>🌤️ SkyCast</h1>

        <div class="search-box">
            <input type="text" placeholder="Enter city name">
            <button>Search</button>
        </div>

        <div id="Loading" class="Loading" 
        style="display: none;">
            Loading...
        </div>

        <div class="weather-card">

            <img src="" id="weather-icon">

            <h2 id="city">City</h2>
            <p id="country"></p>

            <h1 id="temperature">--°C</h1>

            <p id="description">Weather Description</p>

            <div class="details">
                
                <p>🌅 Sunrise: <span id="sunrise">--</span></p>

                <p>🌇 Sunset: <span id="sunset">--</span></p>

                <p>💧 Humidity: <span id="humidity">--</span>%</p>

                <p>🌬️ Wind: <span id="wind">--</span> km/h</p>

                <p>🌡️ Feels Like: <span id="feels-like">--</span>°C</p>

                <p>📈 Pressure: <span id="pressure">--</span> hPa</p>

            </div>

        </div>

    </div>

<script src="script.js"></script>

</body>
</html>
